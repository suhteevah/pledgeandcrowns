[package]
name = "pledge_compile_api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "AGPL-3.0-or-later"
repository.workspace = true
description = "Pledge & Crown - server-side compile-to-WASM API. See design/05-tech-architecture.md sec 2."

[lib]
name = "pledge_compile_api"
path = "src/lib.rs"

[[bin]]
name = "pledge_compile_api"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
uuid = { version = "1", features = ["v4"] }

# Constant-time bearer-token comparison. Already in the workspace lock
# tree (pulled in transitively by rustls), so this adds zero new crates;
# hand-rolling a constant-time compare risks the optimiser short-
# circuiting it, which is exactly the bug `subtle` exists to prevent.
subtle = "2.6"

# WASM execution sandbox. Pinned to wasmtime/wasmtime-wasi 44.0 (released
# in lockstep). The `p1` feature on wasmtime-wasi exposes the WASIp1 /
# preview1 surface used by `_start`-style WASI modules emitted by
# wasm32-wasip1 Rust toolchains.
wasmtime = "44"
wasmtime-wasi = { version = "44", features = ["p1"] }

# Frame-by-frame request-body reading in `middleware::limit_body`, so an
# oversized upload can be drained (bounded) before the 413 is sent.
# Already in the lock tree as an axum/hyper dependency: zero new crates.
http-body-util = "0.1"

# Unix only: safe wrappers for kill(-pgid, SIGKILL), kill(-pgid, 0) and
# geteuid (process-tree kill in `proc_tree`, build-root owner check in
# `build_root`). Already in the lock tree via wasmtime/cap-std/tempfile,
# so this adds zero new crates; it lets us avoid writing any `unsafe`
# libc FFI ourselves. Not compiled on Windows.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process", "std"] }

[dev-dependencies]
reqwest = { workspace = true }
serde_json = "1"
wat = "1"
