[package]
name = "pledge_compile_api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "AGPL-3.0-or-later"
repository.workspace = true
description = "Pledge & Crown - server-side compile-to-WASM API. See design/05-tech-architecture.md sec 2."

[lib]
name = "pledge_compile_api"
path = "src/lib.rs"

[[bin]]
name = "pledge_compile_api"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
axum.workspace = true
# `util` for `ServiceExt::map_request` in `serve_with` (axum already
# enables it; named here so this crate does not rely on unification).
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true

# Own accept loop in `serve_with` so the HTTP/1 header-read timeout can be
# set (axum::serve configures no timer, so hyper never enforces it). Both
# crates are already in the lock tree as axum's own dependencies, with the
# same features axum enables: zero new crates.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service", "http1"] }

# Strict JSON for the API <-> builder IPC and the job-process envelope.
# Already in the lock tree (axum's `json` feature, and a dev-dependency
# here): zero new crates.
serde_json = "1"

tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
uuid = { version = "1", features = ["v4"] }

# Constant-time bearer-token comparison. Already in the workspace lock
# tree (pulled in transitively by rustls), so this adds zero new crates;
# hand-rolling a constant-time compare risks the optimiser short-
# circuiting it, which is exactly the bug `subtle` exists to prevent.
subtle = "2.6"

# WASM execution sandbox. wasmtime/wasmtime-wasi 50.0 (released in
# lockstep; 50.0.1 fixes every RustSec advisory filed against 44.0.1, see
# deny.toml / deploy README section 11). The `p1` feature on wasmtime-wasi
# exposes the WASIp1 / preview1 surface used by `_start`-style WASI
# modules emitted by wasm32-wasip1 Rust toolchains.
#
# Default features OFF: only what the runner uses is compiled in. That
# removes the GC collectors, shared-memory threads, the pooling allocator,
# the module cache (zstd), parallel compilation (rayon), coredumps,
# profiling and debug builtins from the binary altogether, so a future
# config mistake cannot switch them on. `async` is needed for the run
# timeout (an async store lets a blocked WASI host call be cancelled, see
# wasm_runner.rs); wasmtime-wasi's `p1` itself pulls in `component-model`.
wasmtime = { version = "50.0.1", default-features = false, features = ["cranelift", "runtime", "std", "async", "anyhow"] }
wasmtime-wasi = { version = "50.0.1", default-features = false, features = ["p1"] }

# Frame-by-frame request-body reading in `middleware::limit_body`, so an
# oversized upload can be drained (bounded) before the 413 is sent.
# Already in the lock tree as an axum/hyper dependency: zero new crates.
http-body-util = "0.1"

# Unix only: safe wrappers for kill(-pgid, SIGKILL), kill(-pgid, 0),
# geteuid (process-tree kill in `proc_tree`, build-root owner check in
# `build_root`) and open(O_NOFOLLOW) (`wasm_builder::read_artifact`, the
# `fs` feature), PR_SET_CHILD_SUBREAPER + waitpid (`proc_tree` stray
# sweep), and a non-blocking AF_UNIX connect for the bounded builder
# connect (`ipc::connect_builder`, the `net` feature). Already in the lock
# tree via wasmtime/cap-std/tempfile, so this adds zero new crates; it
# lets us avoid writing any `unsafe` libc FFI ourselves. Not compiled on
# Windows.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process", "fs", "net", "std"] }

[dev-dependencies]
reqwest = { workspace = true }
wat = "1"
