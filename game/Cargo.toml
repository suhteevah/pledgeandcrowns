[package]
name = "pledge_and_crown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "MIT"
repository.workspace = true
description = "Pledge & Crown - the Rust-teaching pixel-art RPG."

[features]
# `dev` enables hot-reload, debug overlays, verbose tracing.
default = []
dev = ["bevy/dynamic_linking"]
# `demo` builds the free demo: Acts 1-2 only (missions up to
# `mission::DEMO_LAST_MISSION_ID`), then an end-of-demo panel.
demo = []

[dependencies]
bevy = { workspace = true, features = [
    "bevy_winit",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_state",
    "bevy_asset",
    "bevy_log",
    "x11",
    "wayland",
    "png",
    "default_font",
    "webgl2",
    "web",
    "bevy_picking",
] }
bevy_egui.workspace = true
bevy_ecs_tilemap.workspace = true
bevy_kira_audio.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
bincode.workspace = true

# Editor -> compile-API HTTP client. Native: hyper backend on a
# per-request current-thread Tokio runtime (compile_client/transport.rs).
# Web: the same reqwest API compiles to the browser's fetch.
reqwest.workspace = true
serde_json = "1"
crossbeam-channel = "0.5"

# Native-only: the runtime reqwest's hyper backend needs (it panics with
# "no reactor running" on a Bevy task pool). Tokio is already in the tree
# via reqwest (net, time); this only adds the `rt` feature.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }

# Wasm-only: localStorage save persistence. base64 wraps the bincode
# bytes so they survive the JS string round-trip. js-sys + wasm-bindgen
# (already in the tree via web-sys/reqwest) read window.PLEDGE_CONFIG.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }
base64 = "0.22"
js-sys = "0.3"
wasm-bindgen = "0.2"

[dev-dependencies]
# Cross-crate contract harness: tests in game/tests/ assert that every
# mission's canonical solution passes the live grader. Dev-only: never
# part of the shipped (MIT) game binary.
pledge_compile_api = { path = "../compile-api" }
# Drives the in-process compile-API server in tests/compile_api_client.rs.
tokio.workspace = true
